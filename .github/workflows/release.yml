name: Release update

on:
  push:
    tags:
      - 'v*'

# 既定では権限を与えず、必要なジョブにだけ付与する。
permissions: {}

jobs:
  test:
    # 外部パッケージを導入して全テストを実行するジョブには、書き込み権限を与えない。
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    # 外部パッケージを導入しないジョブで、更新用ZIP・JSONの作成と公開だけを行う。
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build update archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # build_release.py は標準ライブラリだけを使うため、ランナー標準の python3 で実行する。
        run: python3 scripts/build_release.py "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/attendance-update.zip dist/attendance-update.json --verify-tag --notes-file "updates/${RELEASE_TAG#v}.md" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
