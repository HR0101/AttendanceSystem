name: Tests

on:
  push:
  pull_request:
  # release.yml から呼び出し、リリース前にも同じテストを実行する。
  workflow_call:

# テストでは読み取り権限だけを使う。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 改ざん対策として、Actionsはタグではなくコミットハッシュで固定する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # ロックファイルのハッシュと一致するパッケージだけを導入する。
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - name: Audit dependencies
        # 監査ツールはテスト用の環境と分け、既知の脆弱性があれば失敗させる。
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --disable-pip-version-check pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/pip-audit" -r requirements.lock --require-hashes --disable-pip --progress-spinner off
      - run: python -m unittest discover -s tests
