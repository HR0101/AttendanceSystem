name: Tests

on:
  push:
  pull_request:
  # release.yml から呼び出し、リリース前にも同じテストを実行する。
  workflow_call:

# テストでは読み取り権限だけを使う。
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # 改ざん対策として、Actionsはタグではなくコミットハッシュで固定する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate update notes
        run: python scripts/check_update_notes.py --ci
      - name: Verify dependency lock sync
        run: python -c "from pathlib import Path; from src.dependencies import read_spec; spec = read_spec(Path('.')); assert spec['text'] == Path('requirements.lock').read_text(encoding='utf-8')"
      # ロックファイルのハッシュと一致する wheel だけを導入する。
      - run: |
          python -m pip install --no-input --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - name: Audit dependencies
        # 監査ツールはテスト用の環境と分け、既知の脆弱性があれば失敗させる。
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --no-input --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-audit.lock
          "$RUNNER_TEMP/audit/bin/pip-audit" -r requirements.lock --require-hashes --disable-pip --progress-spinner off
      - run: python -m unittest discover -s tests

  macos:
    runs-on: macos-latest
    steps:
      # 改ざん対策として、Actionsはタグではなくコミットハッシュで固定する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate update notes
        run: python scripts/check_update_notes.py --ci
      - name: Verify dependency lock sync
        run: python -c "from pathlib import Path; from src.dependencies import read_spec; spec = read_spec(Path('.')); assert spec['text'] == Path('requirements.lock').read_text(encoding='utf-8')"
      # ロックファイルのハッシュと一致するパッケージだけを導入する。
      - run: |
          python -m pip install --no-input --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s tests

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: false
