name: PR Version Bot

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-version-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version-bot:
    runs-on: ubuntu-latest
    steps:
      # 改ざん対策として、Actionsはタグではなくコミットハッシュで固定する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check version bump and build PR report
        id: check
        run: |
          set +e
          python scripts/check_version_bump.py --ci --include-notes --markdown-report "$RUNNER_TEMP/version-report.md"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/version-report.md" ]; then
            cat "$RUNNER_TEMP/version-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Post or update PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_PATH: ${{ runner.temp }}/version-report.md
          GITHUB_API_URL: ${{ github.api_url }}
        run: python scripts/post_pr_version_comment.py
      - name: Fail if version check failed
        if: steps.check.outputs.status != '0'
        run: exit 1
